name: Build Android APK

# 触发方式：
# 1) 每次 push 到 main/master 自动构建
# 2) 也可以在 GitHub 网页 Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取源码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. 安装 Flutter（固定 3.24.5，与项目配置匹配）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: 4. 补齐 Android 脚手架（兜底，防止缺失文件）
        # 幂等：已存在的文件不会被覆盖，只补齐缺失的
        run: flutter create --platforms=android .

      - name: 5. 获取依赖
        run: flutter pub get

      - name: 6. 检查（可选，失败不影响构建）
        continue-on-error: true
        run: flutter analyze || true

      - name: 7. 构建 Release APK
        run: flutter build apk --release

      - name: 8. 重命名 APK（带日期，方便识别）
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/xk工作台_手机端_$(date +%Y%m%d).apk"
          ls -lh out/

      - name: 9. 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xk-apk
          path: out/*.apk
          retention-days: 90
