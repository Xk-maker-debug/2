name: xk_mobile_app
description: "xk的工作台 手机端 - 与电脑端双向文件互通"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.2.0
  crypto: ^3.0.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  mime: ^1.0.4
  open_filex: ^4.5.0
  permission_handler: ^11.3.0
  file_picker: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
